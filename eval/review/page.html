<!doctype html><html><head><meta charset="utf-8"><title>Country review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--muted:#6b6b66;--card:#fff;--accent:#2457c5;--line:#e3e3dc}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecece6;--muted:#a3a39b;--card:#20201d;
--accent:#7ea2ff;--line:#33332e}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.text{font:28px/1.3 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;
background:var(--bg);padding:8px 12px;border-radius:6px}
.meta{color:var(--muted);font-size:14px}
ol{padding-left:22px} li{margin:4px 0} code{font-weight:600}
input{width:100%;font:20px ui-monospace,monospace;padding:8px;box-sizing:border-box;
border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.keys{font-size:13px;color:var(--muted)} .guide{font-size:13px;color:var(--muted);white-space:pre-wrap}
</style></head><body><main>
<h1>Country review</h1>
<div class="meta" id="progress"></div>
<div class="card"><div class="meta" id="ctx"></div><div class="text" id="text"></div>
<ol id="props"></ol>
<input id="codes" placeholder="codes, e.g. US-DE or CD,CG or NONE" autocomplete="off" autofocus>
<p class="keys">Enter: accept proposal 1 (or submit typed codes) · 1–9: pick proposal ·
n: NONE · s: skip · b: back</p></div>
<div class="guide">__GUIDE__</div>
<div class="meta" id="msg"></div>
</main><script>
let cur=null, hist=[];
const $=id=>document.getElementById(id);
function show(d){
  if(!d.item){$("text").textContent="All done.";$("props").replaceChildren();cur=null;return}
  cur=d; const it=d.item;
  $("progress").textContent=`${d.progress.done} / ${d.progress.total} answered`;
  $("ctx").textContent=`${it.source} · ${it.field} (${it.field_kind}, register ${it.register_country}) · ${it.count}× · ${d.split}`;
  $("text").textContent=it.text===""?"(empty)":it.text.replace(/ /g,"·");
  const ol=$("props"); ol.replaceChildren();
  for(const p of d.proposals){
    const li=document.createElement("li"), c=document.createElement("code"), m=document.createElement("span");
    c.textContent=p[0].join(", "); m.className="meta"; m.textContent=" "+p[1];
    li.append(c,m); ol.append(li);
  }
  $("codes").value=""; $("codes").focus();
}
async function next(){show(await (await fetch("/api/next")).json())}
async function answer(targets,skip=false){
  const r=await fetch("/api/answer",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({item_id:cur.item.item_id,targets,skip})});
  if(!r.ok){$("msg").textContent=(await r.json()).detail;return}
  $("msg").textContent=""; hist.push(cur.item.item_id); next();
}
$("codes").addEventListener("keydown",e=>{
  if(!cur)return; const v=$("codes").value.trim();
  if(e.key==="Enter"){e.preventDefault();
    if(v)answer(v.split(/[\s,;]+/)); else if(cur.proposals.length)answer(cur.proposals[0][0]); return}
  if(v)return;
  if(/^[1-9]$/.test(e.key)){e.preventDefault();const p=cur.proposals[+e.key-1];if(p)answer(p[0])}
  else if(e.key==="n"){e.preventDefault();answer(["NONE"])}
  else if(e.key==="s"){e.preventDefault();answer([],true)}
  else if(e.key==="b"&&hist.length){e.preventDefault();
    fetch("/api/item/"+hist.pop()).then(r=>r.json()).then(show)}
});
next();
</script></body></html>
