<!doctype html><html><head><meta charset="utf-8"><title>Synthetic audit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--muted:#6b6b66;--card:#fff;--line:#e3e3dc;--ok:#1f7a3a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecece6;--muted:#a3a39b;--card:#20201d;
--line:#33332e;--ok:#6fd08c;--bad:#ff8a80}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.text{font:30px/1.3 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all}
.label{font-size:20px;margin:10px 0} .meta{color:var(--muted);font-size:14px}
input{width:100%;font:18px ui-monospace,monospace;padding:8px;box-sizing:border-box;
border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
table{border-collapse:collapse;font-size:14px} td{padding:2px 10px 2px 0}
</style></head><body><main>
<h1>Synthetic audit</h1>
<p class="meta">Is the label right for this text? Enter: correct · x: wrong (type the right codes
first if you know them) · s: skip · b: back. Ambiguous text with a single code is wrong.</p>
<div class="card"><div class="meta" id="tag"></div><div class="text" id="text"></div>
<div class="label" id="label"></div><div class="meta" id="src"></div>
<input id="codes" placeholder="right codes if wrong (optional), e.g. AU or NONE" autocomplete="off" autofocus>
</div>
<table id="prog"></table><div class="meta" id="msg"></div>
</main><script>
let cur=null; const hist=[]; const $=id=>document.getElementById(id);
function show(d){
  const t=$("prog"); t.replaceChildren();
  for(const [tag,s] of Object.entries(d.progress)){
    const tr=document.createElement("tr");
    for(const v of [tag,`${s.audited}/${s.sampled}`,`errors ${s.errors}`,s.g1_pass?"G1 pass":""]){
      const td=document.createElement("td"); td.textContent=v; tr.append(td);}
    t.append(tr);
  }
  if(!d.item){$("text").textContent="All audited.";$("label").textContent="";cur=null;return}
  cur=d.item; $("tag").textContent=cur.tag;
  $("text").textContent=cur.text.replace(/ /g,"·");
  $("label").textContent=cur.targets.map((c,i)=>`${c} — ${cur.names[i]}`).join("  |  ");
  $("src").textContent="from: "+cur.source_alias; $("codes").value=""; $("codes").focus();
}
async function next(){show(await (await fetch("/api/next")).json())}
async function send(verdict){
  const v=$("codes").value.trim();
  const targets=v?v.split(/[\s,;]+/):[];
  const r=await fetch("/api/verdict",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tag:cur.tag,text:cur.text,verdict,targets})});
  if(!r.ok){$("msg").textContent=(await r.json()).detail;return}
  $("msg").textContent=""; hist.push([cur.tag,cur.text]); next();
}
$("codes").addEventListener("keydown",e=>{
  if(!cur)return; const typing=$("codes").value.trim()!=="";
  if(e.key==="Enter"){e.preventDefault(); send(typing?"wrong":"ok"); return}
  if(typing)return;
  if(e.key==="x"){e.preventDefault();send("wrong")}
  else if(e.key==="s"){e.preventDefault();send("skip")}
  else if(e.key==="b"&&hist.length){e.preventDefault();const [tag,text]=hist.pop();
    fetch(`/api/item?tag=${encodeURIComponent(tag)}&text=${encodeURIComponent(text)}`)
      .then(r=>r.json()).then(show)}
});
next();
</script></body></html>
