[project]
name = "country-code-decide"
version = "0.1.0"
description = "Small, fast, calibrated ISO 3166 country (and US state) codes from messy free text"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "anyascii>=0.3",
    "babel>=2.17",
    "httpx>=0.28",
    "numpy>=2.0",
    "pillow>=11",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
]

[project.scripts]
countrycode = "countrycode.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
    "pyright>=1.1.400",
]
eval = [
    "country-converter>=1.2",
    "countrynames==1.16.0",
    "mapie>=1.5",
    "matplotlib>=3.9",
    "normality>=2.5,<3",
    "pycountry>=24.6",
]
serve = [
    "fastapi>=0.115",
    "onnx>=1.17",
    "onnx-ir>=0.1",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "uvicorn>=0.32",
]
# Training / embedding stack. On Linux torch comes from the cu128 index (sm_120 / RTX 5090).
ml = [
    "torch>=2.8,<2.9",
    "transformers>=5.0,<6",
    "safetensors>=0.6",
    "sentencepiece>=0.2",
    "scipy>=1.14",
]

[tool.uv]
default-groups = ["dev", "serve", "ml", "eval"]  # eval: copyleft baselines, never shipped

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# CUDA 12.8 builds (sm_120 / RTX 5090) on Linux
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/countrycode"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["README.md", "model_card.md"]  # generated by scripts/make_docs.py

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "scripts", "eval", "server"]
pythonVersion = "3.12"
