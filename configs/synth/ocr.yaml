# ocr@1 — real OCR errors (plan-03 Task 6). Names are rendered with handwriting-style fonts
# (SIL Open Font License, google/fonts, used only at generation time, never shipped) or DejaVu
# Sans (printed), degraded, and read back by microsoft/trocr-base-handwritten (MIT). Only the
# engine's actual misreadings are kept.
engine: "microsoft/trocr-base-handwritten"
fonts_dir: "data/raw/fonts"
handwriting_fonts: [Caveat.ttf, IndieFlower-Regular.ttf, PatrickHand-Regular.ttf, Kalam-Regular.ttf,
  ShadowsIntoLight.ttf, ArchitectsDaughter-Regular.ttf, GochiHand-Regular.ttf, ReenieBeanie.ttf,
  NanumPenScript-Regular.ttf]
printed_fonts: ["/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"]
handwriting_share: 0.8
upper_share: 0.4          # forms are often filled in capitals
renders_per_alias: 2
min_ratio: 45             # drop OCR output that no longer resembles the source (garbage)
