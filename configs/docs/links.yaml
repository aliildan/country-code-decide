title: "CountryCode-Decide: messy country names to ISO 3166 codes, with calibrated abstention"
paper_title: "From Messy Country Names to ISO 3166 Codes: A Small Model That Abstains, and When a Lexicon Is Enough"
authors:
  - {given: "Ali", family: "Ildan", affiliation: "Unaffiliated"}
year: 2026
version: "1.2.1"
date_released: "2026-10-10"
repo: "https://github.com/aliildan/country-code-decide"
