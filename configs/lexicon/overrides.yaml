# Kosovo (owner request 2026-10-10: "XK kosova alternatiflerini de ekle"). Codes checked against
# Wikidata Q1246 (alpha-3 XKS, FIPS KV, IOC KOS; aliases RKS, XKX) and common practice
# (World Bank / EU XKX, IMF UVK, ISO 3166-2 RS-KM, Albanian KS). "UNK" (UNMIK travel documents) was
# removed 2026-10-10 (plan-09): in registers it means "unknown" (real gold: UNK → NONE).
xk_alternatives:
  codes: ["XKX", "XKS", "RKS", "KOS", "KV", "UVK", "RS-KM", "KS"]
  names:
    - "Kosovo"
    - "Kosova"
    - "Kosovë"
    - "Republika e Kosovës"
    - "Republic of Kosovo"
    - "Kosovo i Metohija"
    - "Kosovo and Metohija"
    - "Kosovo-Metohija"
    - "Kosmet"
    - "Kosovo under UNSCR 1244"
    - "Kosovo UNSCR 1244/99"
    - "Kosovo (UNMIK)"
    - "Косово"
    - "Косово и Метохија"
    - "Republika Kosovo"
    - "Kosova Cumhuriyeti"

# Genuinely ambiguous names kept as candidate sets whatever the sources' support says
# (design-01 §2: abstain or return the set). Keys are compared by compact_key.
force_sets:
  "Congo": ["CD", "CG"]
  "Kongo": ["CD", "CG"]
  "Korea": ["KP", "KR"]
  "Virgin Islands": ["VG", "VI"]
  "Saint Martin": ["MF", "SX"]
  "St Martin": ["MF", "SX"]
  "Micronesia": ["FM", "NONE"]
  # Island groups split between jurisdictions: a company sits in one of them (owner practice
  # 2026-10-10, review guide; plan-09 Task 6).
  "Channel Islands": ["GG", "JE"]
  "Caroline Islands": ["FM", "PW"]

