# Reviewed lexicon overrides (design-01 §2, plan-01 Tasks 7–8). Every entry is reference data
# curated by hand; targets must be in the label space (configs/labels).

# Wikidata items whose labels/aliases name a target although they are not that target's item.
extra_items:
  Q21: "GB"    # England
  Q22: "GB"    # Scotland
  Q25: "GB"    # Wales
  Q26: "GB"    # Northern Ireland

