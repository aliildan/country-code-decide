# Lexicon + synth-v2 (synth-v1 + geo@1, pairs@1, affix@1). Same settings as small-lex.
name: small-synth2
base: jhu-clsp/mmBERT-small
dataset: data/processed/train/synth2.jsonl
epochs: 4
batch: 256
lr_encoder: 5.0e-5
lr_head: 1.0e-3
warmup: 0.05
max_len: 48
state_weight: 1.0
seed: 13
pending_g1: true
