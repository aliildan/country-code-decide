# G3 ablation for v1.1: real register strings + the v1 generators (no city@2/county@1/pairs@2).
name: small-v11-noplace
base: jhu-clsp/mmBERT-small
dataset: data/processed/train/v11-noplace.jsonl
epochs: 4
batch: 256
lr_encoder: 5.0e-5
lr_head: 1.0e-3
warmup: 0.05
max_len: 48
state_weight: 1.0
seed: 13
pending_g1: true
selection: v11
selection_metric: domain_macro
